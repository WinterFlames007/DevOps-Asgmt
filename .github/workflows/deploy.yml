name: 🚀 Deploy PHP Docker app on push

on:
  push:
    branches:
      - main

jobs:
  test-build-deploy:
    name: 🧪 Test, Staging and Production Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🧪 PHP syntax check
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: 📤 Upload project files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "./"
          target: "/home/s2209682-node/htdocs/s2209682n.ncgrp.xyz/Devops/Asgmt/Summative/Code"
          strip_components: 1

      - name: 🐳 Deploy to staging then production
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          envs: APP_URL,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASS,STRIPE_PUBLIC_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,SMTP_HOST,SMTP_USER,SMTP_PASS,SMTP_PORT,SMTP_FROM_EMAIL,SMTP_FROM_NAME
          script: |
            set -e

            APP_DIR="/home/s2209682-node/htdocs/s2209682n.ncgrp.xyz/Devops/Asgmt/Summative/Code"
            IMAGE_NAME="devops-asgmt-app:latest"
            STAGING_CONTAINER="devops-asgmt-staging"
            PRODUCTION_CONTAINER="devops-asgmt-production"

            cd "$APP_DIR"

            echo "Creating secure config.php from GitHub Secrets..."

            cat > config/config.php <<PHP
            <?php

            return [
                'app' => [
                    'name' => 'WorkRelated E-Commerce',
                    'url' => '$APP_URL',
                    'session_name' => 'workrelated_session',
                ],

                'db' => [
                    'host' => '$DB_HOST',
                    'port' => '$DB_PORT',
                    'dbname' => '$DB_NAME',
                    'username' => '$DB_USER',
                    'password' => '$DB_PASS',
                ],

                'stripe' => [
                    'publishable_key' => '$STRIPE_PUBLIC_KEY',
                    'secret_key' => '$STRIPE_SECRET_KEY',
                    'webhook_secret' => '$STRIPE_WEBHOOK_SECRET',
                    'currency' => 'gbp',
                ],

                'mail' => [
                    'host' => '$SMTP_HOST',
                    'username' => '$SMTP_USER',
                    'password' => '$SMTP_PASS',
                    'port' => $SMTP_PORT,
                    'encryption' => 'tls',
                    'from_email' => '$SMTP_FROM_EMAIL',
                    'from_name' => '$SMTP_FROM_NAME'
                ],
            ];
            PHP

            echo "Current directory:"
            pwd

            echo "Files in deployment directory:"
            ls -la

            if [ ! -f Dockerfile ]; then
              echo "ERROR: Dockerfile not found in $APP_DIR"
              exit 1
            fi

            echo "Freeing required ports if existing containers are using them..."
            docker ps --format '{{.ID}} {{.Ports}} {{.Names}}' | grep ':3041->' | awk '{print $1}' | xargs -r docker stop
            docker ps -a --format '{{.ID}} {{.Ports}} {{.Names}}' | grep ':3041->' | awk '{print $1}' | xargs -r docker rm
            docker ps --format '{{.ID}} {{.Ports}} {{.Names}}' | grep ':3040->' | awk '{print $1}' | xargs -r docker stop
            docker ps -a --format '{{.ID}} {{.Ports}} {{.Names}}' | grep ':3040->' | awk '{print $1}' | xargs -r docker rm

            echo "Building Docker image..."
            docker build -t "$IMAGE_NAME" .

            echo "Deploying staging container on port 3041..."
            docker stop "$STAGING_CONTAINER" || true
            docker rm "$STAGING_CONTAINER" || true

            docker run -d \
              --name "$STAGING_CONTAINER" \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              -p 3041:80 \
              "$IMAGE_NAME"

            echo "Testing staging container..."
            sleep 5
            curl -I http://localhost:3041 || exit 1

            echo "Staging test passed. Deploying production container on port 3040..."
            docker stop "$PRODUCTION_CONTAINER" || true
            docker rm "$PRODUCTION_CONTAINER" || true

            docker run -d \
              --name "$PRODUCTION_CONTAINER" \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              -p 3040:80 \
              "$IMAGE_NAME"

            echo "Testing production container..."
            sleep 5
            curl -I http://localhost:3040 || exit 1

            echo "Running containers:"
            docker ps